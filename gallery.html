<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Gallery — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <h1 class="page-title">Media Gallery</h1>
        <p class="page-subtitle">Behind-the-scenes, posters, and stills</p>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = Array.from({length: 60}, (_, i) => `https://picsum.photos/seed/gal${i}/400/400`);
      document.getElementById('galleryGrid').innerHTML = items.map((src, i) => `
        <div class="gallery-item" onclick="NexusNotifications.toast('Image ${i+1}','🖼️')">
          <img src="${src}" alt="" loading="lazy">
        </div>`).join('');
    });
  </script>
</body>
</html>
