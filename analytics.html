<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <h1 class="page-title">Analytics Dashboard</h1>
        <p class="page-subtitle">Playback statistics, engagement metrics, and viewer insights</p>
        <div id="analyticsStats"></div>
        <div class="stats-grid" id="progressRings" style="margin:1.5rem 0"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem">
          <div class="glass-card reveal"><h3>Watch Time by Month</h3><canvas id="chartWatchTime" style="width:100%;height:140px"></canvas></div>
          <div class="glass-card reveal"><h3>Daily Views (30 days)</h3><canvas id="chartViews" style="width:100%;height:140px"></canvas></div>
          <div class="glass-card reveal"><h3>Category Breakdown</h3><canvas id="chartCategories" style="width:200px;height:200px;margin:0 auto;display:block"></canvas></div>
        </div>
        <div class="two-col" style="margin-top:1.5rem">
          <div class="glass-card">
            <h3>Top Videos</h3>
            <table class="data-table"><thead><tr><th>#</th><th>Title</th><th>Views</th><th>Rating</th></tr></thead>
            <tbody id="topVideosList"></tbody></table>
          </div>
          <div class="glass-card">
            <h3>Device Breakdown</h3>
            <div id="deviceBreakdown"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const a = NexusData.analytics;
      document.getElementById('analyticsStats').innerHTML = NexusApp.renderStats([
        { value: a.totalWatchHours + 'h', label: 'Watch Time' },
        { value: NexusData.formatViews(a.totalViews), label: 'Total Views' },
        { value: a.avgSession + 'm', label: 'Avg Session' },
        { value: a.engagement + '%', label: 'Engagement' }
      ]);
    });
  </script>
</body>
</html>
