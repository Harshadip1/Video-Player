<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Customization — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <h1 class="page-title">🎨 Theme Customization</h1>
        <p class="page-subtitle">Personalize colors, accents, and typography</p>
        <h2 class="section-title">Presets</h2>
        <div class="theme-preview-grid" id="themePresets"></div>
        <div class="glass-card" style="margin-top:2rem">
          <h3>Custom Colors</h3>
          <div class="color-picker-row"><label>Primary</label><input type="color" id="primaryColor" value="#7C3AED"></div>
          <div class="color-picker-row"><label>Accent</label><input type="color" id="accentColor" value="#06B6D4"></div>
          <h3 style="margin-top:1rem">Accent Swatches</h3>
          <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
            <div class="accent-swatch" data-color="#7C3AED" style="background:#7C3AED"></div>
            <div class="accent-swatch" data-color="#06B6D4" style="background:#06B6D4"></div>
            <div class="accent-swatch" data-color="#22C55E" style="background:#22C55E"></div>
            <div class="accent-swatch" data-color="#F59E0B" style="background:#F59E0B"></div>
            <div class="accent-swatch" data-color="#EF4444" style="background:#EF4444"></div>
          </div>
          <div class="form-group" style="margin-top:1rem"><label>Font size demo</label>
            <input type="range" id="fontSizeRange" min="14" max="20" value="16">
            <div class="font-size-demo" id="fontDemo">The quick brown fox streams in 4K.</div>
          </div>
        </div>
        <h2 class="section-title" style="margin-top:2rem">VR Theater Concept</h2>
        <div class="vr-theater-concept"><div class="vr-screen"></div></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => NexusThemes.initThemePage());</script>
</body>
</html>
