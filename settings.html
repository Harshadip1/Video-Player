<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <h1 class="page-title">Settings</h1>
        <div class="settings-tabs">
          <span class="settings-tab active">Playback</span>
          <span class="settings-tab">Quality</span>
          <span class="settings-tab">Notifications</span>
          <span class="settings-tab">Privacy</span>
        </div>
        <div class="glass-card">
          <div class="form-group"><label>Default quality</label><select class="form-control"><option>Auto</option><option>4K</option><option>1080p</option><option>720p</option></select></div>
          <div class="form-group"><label><input type="checkbox" checked> Auto-play next video</label></div>
          <div class="form-group"><label><input type="checkbox"> Skip intro automatically</label></div>
          <div class="form-group"><label><input type="checkbox" checked> Remember playback position</label></div>
          <div class="form-group"><label>Default playback speed</label><select class="form-control"><option>1x</option><option>1.25x</option><option>1.5x</option></select></div>
          <button class="btn btn-primary" onclick="NexusNotifications.toast('Settings saved','✓')">Save Changes</button>
        </div>
        <div class="voice-search-ui reveal" style="margin-top:1.5rem">
          <div class="voice-pulse">🎤</div>
          <div><strong>Voice Search</strong><p style="color:var(--text-secondary);font-size:0.9rem">Say "Play action movies" or "Show trending"</p></div>
          <button class="btn btn-outline btn-sm" onclick="NexusNotifications.toast('Listening...','🎤')">Activate</button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
