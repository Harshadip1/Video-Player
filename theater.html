<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Theater Mode — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <h1 class="page-title">🎬 Mini Theater Mode</h1>
        <p class="page-subtitle">Immersive cinematic viewing experience</p>
        <div class="vr-theater-concept" style="min-height:50vh">
          <video id="theaterVideo" class="vr-screen" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" controls poster="https://picsum.photos/seed/theater/1280/720"></video>
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="document.getElementById('theaterVideo').requestFullscreen?.()">Fullscreen</button>
          <button class="btn btn-outline" onclick="document.getElementById('theaterVideo').play()">Play</button>
          <a href="player.html" class="btn btn-outline">Open Full Player</a>
        </div>
        <h2 class="section-title" style="margin-top:2rem">Theater Queue</h2>
        <div id="theaterQueue"></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('theaterQueue').innerHTML = NexusApp.renderVideoGrid(NexusData.featured.slice(0, 8));
    });
  </script>
</body>
</html>
