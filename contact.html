<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content" style="max-width:600px">
        <h1 class="page-title">Contact</h1>
        <p class="page-subtitle">Platform support (demo form)</p>
        <form class="glass-card" onsubmit="event.preventDefault();NexusNotifications.toast('Message sent!','✓')">
          <div class="form-group"><label>Name</label><input class="form-control" required placeholder="Your name"></div>
          <div class="form-group"><label>Email</label><input type="email" class="form-control" required placeholder="email@example.com"></div>
          <div class="form-group"><label>Subject</label><select class="form-control"><option>General</option><option>Technical</option><option>Feedback</option></select></div>
          <div class="form-group"><label>Message</label><textarea class="form-control" rows="5" required></textarea></div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
