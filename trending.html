<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <h1 class="page-title">🔥 Trending Videos</h1>
        <p class="page-subtitle">What's hot right now across the platform</p>
        <div id="trendStats"></div>
        <div id="trendGrid"></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sorted = [...NexusData.videos].sort((a,b) => b.views - a.views);
      document.getElementById('trendStats').innerHTML = NexusApp.renderStats([
        { value: sorted.length, label: 'Trending Titles' },
        { value: '↑24%', label: 'Growth' },
        { value: NexusData.formatViews(sorted[0].views), label: 'Top Views' },
        { value: '12', label: 'Categories' }
      ]);
      document.getElementById('trendGrid').innerHTML = NexusApp.renderVideoGrid(sorted);
    });
  </script>
</body>
</html>
