<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="player-page">
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content player-container">
        <div class="watch-party-bar">👥 Watch Party: 3 viewers connected · Sync enabled</div>
        <div class="player-wrapper" id="playerWrapper">
          <video id="mainVideo" playsinline preload="metadata"></video>
          <div class="player-loading" id="playerLoading"><div class="loader-ring"></div></div>
          <button class="player-big-play" id="bigPlay">▶</button>
          <div class="gesture-hint" id="gestureHint"></div>
          <div class="subtitle-overlay" id="subtitleOverlay"></div>
          <div class="player-overlay">
            <div class="player-controls">
              <div class="seek-bar-wrap">
                <div class="seek-buffer"></div>
                <div class="seek-progress"></div>
                <input type="range" class="seek-input" id="seekInput" min="0" max="100" value="0">
              </div>
              <div class="controls-row">
                <button class="control-btn" id="playBtn">▶</button>
                <button class="control-btn" id="rewindBtn">⏪</button>
                <button class="control-btn" id="forwardBtn">⏩</button>
                <div class="volume-wrap">
                  <button class="control-btn" id="muteBtn">🔊</button>
                  <div class="volume-slider"><input type="range" id="volumeInput" min="0" max="100" value="80"></div>
                </div>
                <span class="time-display"><span id="currentTime">0:00</span> / <span id="durationTime">0:00</span></span>
                <span class="sleep-timer-badge" id="sleepBadge" style="display:none"></span>
                <button class="control-btn" id="subToggle" title="Subtitles">💬</button>
                <div style="position:relative">
                  <button class="control-btn" id="speedBtn">1x</button>
                  <div class="speed-menu" id="speedMenu">
                    <button data-speed="0.5">0.5x</button>
                    <button data-speed="0.75">0.75x</button>
                    <button data-speed="1" class="active">1x</button>
                    <button data-speed="1.25">1.25x</button>
                    <button data-speed="1.5">1.5x</button>
                    <button data-speed="2">2x</button>
                  </div>
                </div>
                <button class="control-btn" id="theaterBtn" title="Theater">🎬</button>
                <button class="control-btn" id="miniBtn" title="Mini player">⊡</button>
                <button class="control-btn" id="pipBtn" title="PiP">⧉</button>
                <button class="control-btn" id="castBtn" title="Cast">📺</button>
                <button class="control-btn" id="bookmarkBtn" title="Bookmark">🔖</button>
                <button class="control-btn" id="fullscreenBtn">⛶</button>
              </div>
            </div>
          </div>
        </div>

        <div class="player-sidebar">
          <div class="player-meta">
            <h1 id="playerTitle">Loading...</h1>
            <p><span id="playerViews"></span> · <span id="playerRating"></span> · <span class="badge-pill">4K HDR</span></p>
            <p id="playerDesc" style="color:var(--text-secondary);margin:1rem 0"></p>
            <div class="player-actions">
              <button class="btn btn-primary" onclick="NexusNotifications.toast('Added to favorites','❤️')">❤ Favorite</button>
              <button class="btn btn-outline" onclick="NexusNotifications.toast('Added to playlist','📋')">+ Playlist</button>
              <button class="btn btn-outline" id="shortcutsBtn">⌨ Shortcuts</button>
              <button class="btn btn-outline" id="sleepTimerBtn">🌙 Sleep Timer</button>
              <button class="btn btn-outline" id="audioOnlyBtn">🎵 Audio Only</button>
              <label style="display:flex;align-items:center;gap:0.5rem"><input type="checkbox" id="autoPlayToggle" checked> Auto-play next</label>
            </div>
            <div class="equalizer-ui" id="eqBars"></div>
          </div>
          <div>
            <h3 class="section-title">Up Next</h3>
            <div id="relatedVideos" class="video-grid" style="grid-template-columns:1fr"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="shortcuts-panel" id="shortcutsPanel">
    <div class="shortcuts-content">
      <h2>Keyboard Shortcuts</h2>
      <p><kbd>Space</kbd> / <kbd>K</kbd> Play/Pause</p>
      <p><kbd>F</kbd> Fullscreen · <kbd>M</kbd> Mute</p>
      <p><kbd>←</kbd> <kbd>→</kbd> Seek ±5s · <kbd>↑</kbd> <kbd>↓</kbd> Volume</p>
      <p><kbd>?</kbd> Toggle this panel</p>
      <button class="btn btn-primary" id="closeShortcuts" style="margin-top:1rem">Close</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script src="js/player.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const eq = document.getElementById('eqBars');
      for (let i = 0; i < 12; i++) {
        const b = document.createElement('div');
        b.className = 'eq-bar';
        b.style.height = (20 + Math.random() * 40) + 'px';
        eq.appendChild(b);
        setInterval(() => { b.style.height = (15 + Math.random() * 45) + 'px'; }, 200 + i * 50);
      }
    });
  </script>
</body>
</html>
