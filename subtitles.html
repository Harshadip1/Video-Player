<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitles — NexusStream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div id="app-root" class="app-layout">
    <div class="main-content">
      <div class="page-content two-col">
        <div>
          <h1 class="page-title">Subtitle Settings</h1>
          <p class="page-subtitle">48+ subtitle tracks · Multi-language · Custom styling</p>
          <div class="glass-card" style="margin-bottom:1.5rem">
            <div class="form-group"><label><input type="checkbox" id="subEnabled" checked> Enable subtitles</label></div>
            <div class="form-group"><label>Font size</label><input type="range" id="fontSizeRange" min="0.8" max="2" step="0.1" value="1.1" class="form-control"></div>
            <div class="form-group"><label>Text color</label><input type="color" id="subColor" value="#FFFFFF" class="form-control"></div>
            <div class="form-group"><label>Background opacity</label><input type="range" id="bgOpacity" min="0" max="100" value="75" class="form-control"></div>
            <div class="form-group"><label>Sync offset: <span id="syncValue">0s</span></label><input type="range" id="syncOffset" min="-5" max="5" value="0" class="form-control"></div>
          </div>
          <div id="subPreview" class="glass-card" style="text-align:center;padding:2rem;font-size:1.1rem">Subtitle preview: Welcome to NexusStream</div>
          <h2 class="section-title" style="margin-top:1.5rem">Available Tracks</h2>
          <div id="subtitleTracks"></div>
        </div>
        <div class="ai-panel">
          <h3>🤖 Smart Subtitles</h3>
          <p style="color:var(--text-secondary)">AI-powered auto-transcription and real-time translation UI (demo).</p>
          <button class="btn btn-primary btn-sm" style="margin-top:1rem" onclick="NexusNotifications.toast('Smart subtitles enabled','🤖')">Enable Smart Mode</button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script src="js/subtitles.js"></script>
</body>
</html>
